name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Catalogo

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore MotoTrack.slnx

      - name: Build
        run: dotnet build MotoTrack.slnx --no-restore --nologo

      - name: Test
        run: dotnet test ../MotoTrack.Tests/MotoTrack.Tests.csproj --no-build --nologo
