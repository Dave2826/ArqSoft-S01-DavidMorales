<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <style>
      .sym { stroke: #ff7a00; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .txt { fill: #f5f5f5; font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.03em; }
      .tag { fill: #888; font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 400; font-size: 22px; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g transform="translate(640, 260)">
    <path class="sym" d="M-280 100 L-200 -120 L-80 40 L40 -120 L120 40 L240 -120 L320 100"/>
    <text class="txt" x="0" y="60" text-anchor="middle">MotoTrack</text>
  </g>
  <text class="tag" x="640" y="380" text-anchor="middle">Smart motorcycle maintenance tracking</text>
</svg>
